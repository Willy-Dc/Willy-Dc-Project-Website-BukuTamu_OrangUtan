    <main>
        <div class="container">
            <h2>OUH-Orang Utan Haven</h2>

            <form action="proses.php" method="POST">

                <div class="form-group">
                    <label><i class="fa fa-user"></i> Nama Lengkap</label>
                    <input type="text" name="nama" placeholder="Contoh: Budi" required>
                </div>

                <div class="form-group">
                    <label><i class="fa fa-phone"></i> Nomor Handphone/WhatsApp</label>
                    <input type="text" name="hp" placeholder="Contoh: +628123456789" required>
                    <small>*Harus dimulai dengan kode negara (+62..)</small>
                </div>

                <div class="form-group">
                    <label><i class="fa fa-building"></i> Instansi Asal</label>
                    <input type="text" name="instansi" placeholder="Contoh: Universitas Satya Terra Bhinneka" required>
                </div>

                <div class="form-group">
                    <label><i class="fa fa-map-marker-alt"></i> Alamat</label>
                    <input type="text" name="alamat" placeholder="Contoh: Jl. Merdeka No. 123" required>
                </div>

                <div class="form-group">
                    <label><i class="fa fa-info-circle"></i> Keperluan</label>
                    <textarea name="keperluan" placeholder="Jelaskan tujuan kunjungan Anda..." required></textarea>
                </div>

                <button type="submit"><i class="fa fa-paper-plane"></i> Submit</button>

            </form>
        </div>
